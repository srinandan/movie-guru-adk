steps:
  # Build and Push
  - name: "gcr.io/cloud-builders/docker"
    env:
      - 'DOCKER_BUILDKIT=1'  
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}",
      ]

  # Deploy to Staging
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "${_CONTAINER_NAME}"
      - "--project"
      - "${PROJECT_ID}"
      - "--region" 
      - "${_REGION}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}"
      - "--cpu" 
      - "1000m"
      - "--memory" 
      - "4Gi"
      - "--service-account" 
      - "movie-guru-chat-server-sa@${PROJECT_ID}.iam.gserviceaccount.com"
      - "--set-env-vars" 
      - 'DB_HOST=${_DB_HOST},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}'
      - "--session-affinity"
      - "--vpc-egress"
      - "private-ranges-only"
      - "--network"
      - "movie-guru-network"
      - "--subnet"
      - "movie-guru-subnet"
      - "--set-secrets"
      - 'DB_PASS=postgres-root-password-secret:latest'      
      - "--labels=appid=movie-guru-adk"

substitutions:
  _STAGING_PROJECT_ID: ${PROJECT_ID}
  _REGION: ${_REGION}
  _ARTIFACT_REGISTRY_REPO_NAME: movie-guru
  _CONTAINER_NAME: movie-guru-data
  _CLOUD_RUN_APP_SA_EMAIL: "movie-guru-chat-server-sa@${PROJECT_ID}.iam.gserviceaccount.com"
  _DB_HOST: "10.2.0.2"
  _DB_USER="postgres"
  _DB_NAME="fake-movies-db"
  _COMMIT_SHA: ${_COMMIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}  

options:
  pool:
    name: "projects/$PROJECT_ID/locations/$LOCATION/workerPools/movie-guru"
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  requestedVerifyOption: VERIFIED
