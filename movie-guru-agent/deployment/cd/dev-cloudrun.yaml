steps:
  # Build and Push
  - name: "gcr.io/cloud-builders/docker"
    env:
      - 'DOCKER_BUILDKIT=1'  
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}",
      ]

  # Deploy to Staging
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "movie-guru-agent"
      - "--project"
      - "${PROJECT_ID}"
      - "--region" 
      - "${_REGION}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}"
      - "--port" 
      - "8080"
      - "--cpu" 
      - "1000m"
      - "--memory" 
      - "1Gi"
      - "--concurrency"
      - "10"
      - "--service-account" 
      - "movie-guru-chat-server-sa@${PROJECT_ID}.iam.gserviceaccount.com"
      - "--set-env-vars" 
      - 'MCPTOOLSET_URL=movie-guru-mcp-server-${PROJECT_NUMBER}.${_REGION}.run.app,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},USER_ID=fake,DB_HOST=${_DB_HOST},A2A_CONV_AGENT=conversation-analysis-agent-${PROJECT_NUMBER}.${_REGION}.run.app,OPENAI_API_BASE=https://litellm-server-${PROJECT_NUMBER}.${_REGION}.run.app/v1,MODEL_NAME=${_MODEL_NAME}'
      - "--startup-probe"
      - 'initialDelaySeconds=30,tcpSocket.port=8080,timeoutSeconds=240,periodSeconds=240,failureThreshold=1'
      - "--max-instances" 
      - "1"
      - "--allow-unauthenticated"
      - "--timeout"
      - "300"
      - "--cpu-boost"
      - "--session-affinity"
      - "--vpc-egress"
      - "private-ranges-only"
      - "--network"
      - "movie-guru-network"
      - "--subnet"
      - "movie-guru-subnet"
      - "--set-secrets"
      - 'DB_PASSWORD=postgres-root-password-secret:latest'      
      - "--ingress"
      - "internal-and-cloud-load-balancing"
      - "--labels=appid=movie-guru-adk"

substitutions:
  _STAGING_PROJECT_ID: ${PROJECT_ID}
  _REGION: ${_REGION}
  _ARTIFACT_REGISTRY_REPO_NAME: movie-guru
  _CONTAINER_NAME: movie-guru-agent
  _CLOUD_RUN_APP_SA_EMAIL: "movie-guru-chat-server-sa@${PROJECT_ID}.iam.gserviceaccount.com"
  _MODEL_NAME: "openai/gemini-2.5-flash-lite"
  _DB_HOST: "10.2.0.2"
  _COMMIT_SHA: ${_COMMIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:${_COMMIT_SHA}  

options:
  pool:
    name: "projects/$PROJECT_ID/locations/$LOCATION/workerPools/movie-guru"
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  requestedVerifyOption: VERIFIED
