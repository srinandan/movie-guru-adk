[project]
name = "movie-guru-ax-subagent"
version = "0.1.0"
description = "A subagent for analyzing conversations for movie recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.9",
    "asyncpg>=0.31.0",
    "click>=8.3.0",
    "google-adk[litellm]",
    "litellm>=1.78.6",
    "opentelemetry-exporter-otlp-proto-grpc>=1.37.0",
    "opentelemetry-instrumentation-starlette>=0.58b0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]
