model_list:
  - model_name: gemini-2.5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      vertex_ai_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_ai_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gpt-oss-120b
    litellm_params:
      model: vertex_ai/openai/gpt-oss-120b
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: "low"  # Options: "minimal", "low", "medium", "high"
      vertex_ai_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_ai_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: vertex_ai/gemini-2.0-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      vertex_ai_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_ai_location: os.environ/GOOGLE_CLOUD_LOCATION

  - model_name: ollama-gemma3-4b
    litellm_params:
      model: ollama/gemma3:4b
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  drop_params: true
  request_timeout: 60
  set_verbose: false
  json_logs: true
  callbacks: ["otel"]
  cache: true
  cache_params:
    type: "redis"
    similarity_threshold: 0.8
    redis_startup_nodes: [{"host": os.environ/REDIS_HOST, "port": os.environ/REDIS_PORT}]
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

prompt_cache:
  type: "redis"
  host: os.environ/REDIS_HOST
  port: os.environ/REDIS_PORT

guardrails:
  - guardrail_name: model-armor-shield
    litellm_params:
      guardrail: model_armor
      mode: [pre_call]                             # Run on input
      template_id: "movie-guru"                    # Required: Your Model Armor template ID
      project_id: os.environ/GOOGLE_CLOUD_PROJECT  # GCP project ID
      location: "global"                           # GCP location (default: us-central1)
      mask_request_content: true                   # Enable request content masking
      mask_response_content: false                 # Disable response content masking
      fail_on_error: false                         # Fail request if Model Armor errors (default: true)
      default_on: true                             # Run by default for all requests
      api_endpoint: "https://modelarmor.googleapis.com"